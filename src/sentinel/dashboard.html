<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Township Sentinel</title>
  <style>
    :root {
      color-scheme: dark;
      font: 15px system-ui, sans-serif;
      background: #0b1220;
      color: #f8fafc
    }

    body {
      margin: 0;
      padding: 24px;
      max-width: 1440px;
      margin-inline: auto
    }

    header,
    .toolbar,
    .card-head,
    .metrics {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap
    }

    header {
      justify-content: space-between;
      margin-bottom: 22px
    }

    h1 {
      margin: 0;
      font-size: 1.7rem
    }

    h2 {
      margin: 0 0 12px;
      font-size: 1.2rem
    }

    input,
    select,
    button {
      border-radius: 7px;
      border: 1px solid #64748b;
      padding: 9px 12px;
      font: inherit
    }

    input,
    select {
      background: #111c2e;
      color: #fff;
    }

    #key { min-width: 230px }

    .zone-editor { margin-top: 12px }
    .zone-editor summary { cursor: pointer }
    .zone-editor .toolbar { margin-top: 10px }
    .zone-editor input, .zone-editor select { width: 100%; box-sizing: border-box }
    .zone-editor .toolbar button { padding: 7px 9px }
    .zone-note { min-height: 1.2em; font-size: .85rem }

    button {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
      cursor: pointer
    }

    button.stop {
      background: #334155;
      border-color: #475569
    }

    button:disabled {
      opacity: .5;
      cursor: default
    }

    .muted {
      color: #aebbd0
    }

    .error {
      color: #fca5a5
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 300px));
      gap: 16px
    }

    @media (max-width: 300px) {
      .grid { grid-template-columns: 1fr }
    }

    .card,
    .panel {
      background: #172235;
      border: 1px solid #2b3a50;
      border-radius: 12px;
      padding: 16px
    }

    .card-head {
      justify-content: space-between
    }

    .state {
      font-size: .9rem;
      color: #93c5fd
    }

    .visual {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #050a12;
      margin-block: 12px;
      overflow: hidden
    }

    .visual img {
      width: 100%;
      height: 100%;
      display: block
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #aebbd0
    }

    .box {
      position: absolute;
      box-sizing: border-box;
      border: 2px solid #36e7a7;
      pointer-events: none
    }

    .box.vehicle {
      border-color: #60a5fa
    }

    .box span {
      position: absolute;
      left: -2px;
      top: -25px;
      background: #064e3b;
      padding: 2px 5px;
      white-space: nowrap;
      font-size: .75rem
    }

    .box.vehicle span {
      background: #1e40af
    }

    .zone {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none
    }

    .zone.drawing { pointer-events: auto; cursor: crosshair }

    .metrics {
      gap: 20px;
      color: #cbd5e1
    }

    section.results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
      margin-top: 18px
    }

    ul {
      padding-left: 20px;
      margin-bottom: 0
    }

    li {
      margin: 7px 0
    }
  </style>
</head>

<body>
  <header>
    <h1>Township Sentinel</h1>
    <div class="toolbar">
      <label>API key <input id="key" type="password" autocomplete="off"></label>
      <button id="connect">Connect</button>
      <span id="status" class="muted">Disconnected</span>
    </div>
  </header>
  <main id="grid" class="grid"></main>
  <section class="results">
    <div class="panel">
      <h2>Recent successful detections</h2>
      <p class="muted">Newly detected people and vehicles appear here.</p>
      <ul id="detections"></ul>
    </div>
    <div class="panel">
      <h2>Safety alerts</h2>
      <p class="muted">Zone alerts are separate from object detections and need human review.</p>
      <ul id="events"></ul>
    </div>
  </section>
  <script>
    const key = document.getElementById('key');
    const grid = document.getElementById('grid');
    const status = document.getElementById('status');
    let cameras = [], busy = false, timer = null, frameTimer = null;
    const frameBusy = new Set();

    async function request(path, options = {}) {
      const response = await fetch(path, { ...options, headers: { 'X-API-Key': key.value, ...(options.headers || {}) } });
      if (!response.ok) {
        let detail = `${response.status} ${response.statusText}`;
        try { detail = (await response.json()).detail || detail; } catch (_) { }
        throw Error(detail);
      }
      return response;
    }
    async function json(path, options) { return (await request(path, options)).json(); }
    function node(tag, className, value) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (value !== undefined) element.textContent = value;
      return element;
    }
    function renderZones(camera, svg, draft = null) {
      svg.replaceChildren();
      for (const zone of camera.zones) {
        const polygon = document.createElementNS(svg.namespaceURI, 'polygon');
        polygon.setAttribute('points', zone.polygon.map(([x, y]) => `${x * 100},${y * 100}`).join(' '));
        polygon.setAttribute('fill', '#ef444433'); polygon.setAttribute('stroke', '#ef4444');
        svg.append(polygon);
        const label = document.createElementNS(svg.namespaceURI, 'text');
        label.setAttribute('x', zone.polygon[0][0] * 100);
        label.setAttribute('y', zone.polygon[0][1] * 100);
        label.setAttribute('fill', 'white'); label.setAttribute('font-size', '4');
        label.textContent = zone.id;
        svg.append(label);
      }
      if (draft?.length) {
        const line = document.createElementNS(svg.namespaceURI, 'polyline');
        line.setAttribute('points', draft.map(([x, y]) => `${x * 100},${y * 100}`).join(' '));
        line.setAttribute('fill', 'none'); line.setAttribute('stroke', '#facc15');
        line.setAttribute('stroke-width', '0.8'); svg.append(line);
        for (const [x, y] of draft) {
          const dot = document.createElementNS(svg.namespaceURI, 'circle');
          dot.setAttribute('cx', x * 100); dot.setAttribute('cy', y * 100);
          dot.setAttribute('r', '1'); dot.setAttribute('fill', '#facc15'); svg.append(dot);
        }
      }
    }
    function zoneEditor(camera, card, svg) {
      const editor = node('details', 'zone-editor');
      editor.append(node('summary', '', 'Edit zones'));
      const choices = node('select');
      const name = node('input'); name.placeholder = 'Zone ID';
      const rule = node('select');
      for (const value of ['intrusion', 'loitering', 'wall_climbing', 'door_tampering']) {
        const option = node('option', '', value.replaceAll('_', ' ')); option.value = value; rule.append(option);
      }
      const note = node('p', 'zone-note muted', 'Select a zone, click Draw, then mark at least three points on the video. For door tampering, outline only the handle or lock.');
      function fillChoices(selected = '') {
        choices.replaceChildren();
        const fresh = node('option', '', 'New zone'); fresh.value = ''; choices.append(fresh);
        for (const zone of camera.zones) {
          const option = node('option', '', zone.id); option.value = zone.id; choices.append(option);
        }
        choices.value = selected;
        const current = camera.zones.find(zone => zone.id === selected);
        name.value = current?.id || ''; rule.value = current?.rule || 'intrusion';
      }
      fillChoices(camera.zones[0]?.id || '');
      choices.onchange = () => { const selected = choices.value; stopDrawing(); fillChoices(selected); };
      const controls = node('div', 'toolbar');
      const draw = node('button', '', 'Draw');
      const undo = node('button', 'stop', 'Undo point');
      const save = node('button', '', 'Save');
      const cancel = node('button', 'stop', 'Cancel');
      const remove = node('button', 'stop', 'Remove');
      controls.append(draw, undo, save, cancel, remove);
      card._draft = null;
      function stopDrawing() {
        card._draft = null; svg.classList.remove('drawing'); renderZones(camera, svg);
      }
      draw.onclick = () => {
        card._draft = []; svg.classList.add('drawing');
        note.textContent = 'Click at least three corners of the zone on the video, then Save.';
        renderZones(camera, svg, card._draft);
      };
      svg.onclick = event => {
        if (!card._draft) return;
        const bounds = svg.getBoundingClientRect();
        card._draft.push([Math.max(0, Math.min(1, (event.clientX - bounds.left) / bounds.width)),
                          Math.max(0, Math.min(1, (event.clientY - bounds.top) / bounds.height))]);
        renderZones(camera, svg, card._draft);
        note.textContent = `${card._draft.length} points selected`;
      };
      undo.onclick = () => { if (card._draft?.length) { card._draft.pop(); renderZones(camera, svg, card._draft); } };
      cancel.onclick = () => { stopDrawing(); note.textContent = 'Drawing cancelled.'; };
      async function persist(zones, selected) {
        try {
          const result = await json(`/api/v1/cameras/${encodeURIComponent(camera.id)}/zones`, {
            method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(zones)
          });
          camera.zones = result.zones;
          stopDrawing(); fillChoices(selected);
          note.textContent = `Saved to ${result.saved_to}. Use that config file after restarting the server.`;
          note.classList.remove('error');
        } catch (error) { note.textContent = error.message; note.classList.add('error'); }
      }
      save.onclick = async () => {
        const id = name.value.trim();
        const current = camera.zones.find(zone => zone.id === choices.value);
        if (!id || camera.zones.some(zone => zone.id === id && zone !== current)) {
          note.textContent = 'Enter a unique zone ID.'; return;
        }
        if (card._draft && card._draft.length < 3) { note.textContent = 'Select at least three points.'; return; }
        if (!current && !card._draft) { note.textContent = 'Draw the new zone first.'; return; }
        const updated = { ...(current || {}), id, rule: rule.value, polygon: card._draft || current.polygon };
        const zones = current ? camera.zones.map(zone => zone.id === current.id ? updated : zone) : [...camera.zones, updated];
        await persist(zones, id);
      };
      remove.onclick = async () => {
        if (!choices.value) return;
        await persist(camera.zones.filter(zone => zone.id !== choices.value), '');
      };
      editor.append(choices, name, rule, controls, note);
      return editor;
    }
    function cameraCard(camera) {
      const card = node('article', 'card'); card.dataset.cameraId = camera.id;
      const head = node('div', 'card-head');
      head.append(node('h2', '', camera.name), node('span', 'state', 'Camera off'));
      const visual = node('div', 'visual');
      if (camera.source_type === 'video') visual.append(node('img'));
      visual.append(node('div', 'placeholder', camera.source_type === 'video' ? 'Camera is off' : 'Virtual source'));
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 100 100'); svg.setAttribute('preserveAspectRatio', 'none'); svg.classList.add('zone');
      renderZones(camera, svg);
      visual.append(svg);
      const metrics = node('div', 'metrics'); metrics.append(node('span', 'people', 'People: 0'), node('span', 'vehicles', 'Vehicles: 0'));
      card.append(head, visual, metrics);
      if (camera.source_type === 'video') {
        const controls = node('div', 'toolbar');
        const start = node('button', 'start', 'Start camera + detection');
        const stop = node('button', 'stop camera-stop', 'Stop camera'); stop.disabled = true;
        start.onclick = () => changeCamera(camera.id, 'start');
        stop.onclick = () => changeCamera(camera.id, 'stop');
        controls.append(start, stop); card.append(controls);
      }
      card.append(zoneEditor(camera, card, svg));
      return card;
    }
    async function changeCamera(id, action) {
      const card = [...grid.children].find(item => item.dataset.cameraId === id);
      card.querySelectorAll('button.start, button.camera-stop').forEach(button => button.disabled = true);
      try { await json(`/api/v1/cameras/${encodeURIComponent(id)}/${action}`, { method: 'POST' }); await refresh(); }
      catch (error) { card.querySelector('.state').textContent = error.message; card.querySelector('.state').classList.add('error'); }
    }
    async function showSnapshot(camera, card) {
      const image = card.querySelector('img');
      const response = await request(`/api/v1/cameras/${encodeURIComponent(camera.id)}/snapshot`);
      const blob = await response.blob();
      if (card.dataset.state !== 'running') return;
      const url = URL.createObjectURL(blob);
      const previous = image.dataset.url;
      image.onload = () => { card.querySelector('.visual').style.aspectRatio = `${image.naturalWidth} / ${image.naturalHeight}`; if (previous) URL.revokeObjectURL(previous); };
      image.src = url; image.dataset.url = url;
    }
    function clearSnapshot(card) {
      const image = card.querySelector('img');
      if (image && image.dataset.url) { URL.revokeObjectURL(image.dataset.url); image.removeAttribute('src'); delete image.dataset.url; }
    }
    function renderList(id, items, describe) {
      const list = document.getElementById(id);
      list.replaceChildren(...items.slice(0, 30).map(item => node('li', '', describe(item))));
    }
    async function refreshFrames() {
      for (const camera of cameras) {
        if (camera.source_type !== 'video' || frameBusy.has(camera.id)) continue;
        const card = [...grid.children].find(item => item.dataset.cameraId === camera.id);
        if (!card || card.dataset.state !== 'running') continue;
        frameBusy.add(camera.id);
        try { await showSnapshot(camera, card); }
        catch (error) { card.querySelector('.state').textContent = error.message; }
        finally { frameBusy.delete(camera.id); }
      }
    }
    async function refresh() {
      if (busy || !key.value || !cameras.length) return;
      busy = true;
      try {
        for (const camera of cameras) {
          const id = encodeURIComponent(camera.id);
          const card = [...grid.children].find(item => item.dataset.cameraId === camera.id);
          const [state, tracks] = await Promise.all([json(`/api/v1/cameras/${id}/status`), json(`/api/v1/cameras/${id}/tracks`)]);
          card.dataset.state = state.state;
          const stateLabel = card.querySelector('.state');
          stateLabel.textContent = state.state === 'running' ? `Detecting with ${state.detector}` :
            state.state === 'starting' ? 'Opening camera and detector…' : state.state === 'finished' ? 'Video finished · Start to replay' : state.state === 'error' ? `Camera error: ${state.error}` : 'Camera off';
          stateLabel.classList.toggle('error', state.state === 'error');
          const start = card.querySelector('.start'), stop = card.querySelector('.stop');
          if (start) { start.disabled = state.state === 'running' || state.state === 'starting'; stop.disabled = state.state === 'stopped' || state.state === 'finished'; }
          card.querySelector('.people').textContent = `People: ${state.person_count}`;
          card.querySelector('.vehicles').textContent = `Vehicles: ${state.vehicle_count}`;
          const visual = card.querySelector('.visual');
          visual.querySelectorAll('.box').forEach(box => box.remove());
          for (const track of tracks) {
            const box = node('div', `box ${track.kind}`);
            box.style.left = `${track.box[0] * 100}%`; box.style.top = `${track.box[1] * 100}%`;
            box.style.width = `${(track.box[2] - track.box[0]) * 100}%`;
            box.style.height = `${(track.box[3] - track.box[1]) * 100}%`;
            box.append(node('span', '', `${track.kind} #${track.id} · ${Math.round(track.confidence * 100)}%`));
            visual.append(box);
          }
          const placeholder = card.querySelector('.placeholder');
          placeholder.style.display = state.state === 'running' ? 'none' : 'grid';
          if (camera.source_type === 'video' && state.state !== 'running') clearSnapshot(card);
        }
        const [detections, events] = await Promise.all([json('/api/v1/detections'), json('/api/v1/events')]);
        renderList('detections', detections, item => `${new Date(item.observed_at).toLocaleTimeString()} · ${item.camera_id} · ${item.kind} #${item.track_id} · ${Math.round(item.confidence * 100)}% confidence`);
        renderList('events', events, item => `${new Date(item.observed_at).toLocaleTimeString()} · ${item.camera_id} · ${item.message}`);
        status.textContent = 'Connected'; status.classList.remove('error');
      } catch (error) { status.textContent = error.message; status.classList.add('error'); }
      finally { busy = false; }
    }
    document.getElementById('connect').onclick = async () => {
      try {
        cameras = await json('/api/v1/cameras');
        grid.replaceChildren(...cameras.map(cameraCard));
        await refresh();
        clearInterval(timer); clearInterval(frameTimer);
        timer = setInterval(refresh, 700);
        frameTimer = setInterval(refreshFrames, 150);
        refreshFrames();
      } catch (error) { status.textContent = error.message; status.classList.add('error'); }
    };
  </script>
</body>

</html>
