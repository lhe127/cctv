[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "township-sentinel"
version = "0.1.0"
description = "Virtual-first, multi-camera safety monitoring prototype"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
video = ["opencv-python>=4.10,<5", "numpy>=2,<3", "supervision==0.27.0"]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg", "web/vendor/*.js", "web/vendor/*.txt", "vendor/OPENCV_ZOO_YOLOX_LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
